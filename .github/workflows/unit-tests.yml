name: C# unit tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PowerShell 5.1 encoding and installer tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\cli-installer\Test-AteliersAiOrchestratorConfigInstaller.ps1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Ateliers.Ai.Orchestrator.sln

      - name: Build solution
        run: dotnet build Ateliers.Ai.Orchestrator.sln --configuration Release --no-restore

      - name: Run Fake-only unit tests
        run: dotnet test tests/Ateliers.Ai.Orchestrator.UnitTests/Ateliers.Ai.Orchestrator.UnitTests.csproj --configuration Release --no-build --no-restore --filter Category=Unit

      - name: Run Slack unit tests
        run: dotnet test tests/Ateliers.Slack.UnitTests/Ateliers.Slack.UnitTests.csproj --configuration Release --no-build --no-restore
